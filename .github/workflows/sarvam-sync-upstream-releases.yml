name: Sarvam sync upstream releases

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect the release plan without changing workflows, refs, or PRs
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sarvam-sync-upstream-releases
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'sarvamai/vllm' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out trusted Sarvam automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Validate synchronization credential
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_SYNC_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Configure REPOSITORY_SYNC_TOKEN; see .github/sarvam/README.md"
            exit 1
          fi

      - name: Keep inherited upstream workflows disabled
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_SYNC_TOKEN }}
        run: python3 .github/sarvam/sync_releases.py --repo sarvamai/vllm --disable-upstream-workflows

      - name: Mirror stable releases and open draft PRs
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_SYNC_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          gh auth setup-git
          args=(--repo sarvamai/vllm)
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python3 .github/sarvam/sync_releases.py "${args[@]}"
